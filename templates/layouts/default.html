{@io.quarkiverse.roq.frontmatter.runtime.model.Page page}
{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {#seo page site /}
  <link rel="icon" href="{=site.url('favicon.svg')}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{=site.url('css/main.css')}">
  <script>{|
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') { document.documentElement.setAttribute('data-theme', t); }
      } catch (e) {}
    })();
  |}</script>
  {#insert head /}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {#include partials/header /}
  <main id="main">
  {#insert /}
  </main>
  {#include partials/footer /}
  <script>{|
    (function () {
      var root = document.documentElement;
      var btn = document.querySelector('.theme-toggle');
      if (!btn) { return; }
      function current() {
        var t = root.getAttribute('data-theme');
        if (t === 'dark' || t === 'light') { return t; }
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      function label() {
        btn.setAttribute('aria-label', current() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      }
      btn.addEventListener('click', function () {
        var next = current() === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        label();
      });
      label();
    })();
  |}</script>
</body>
</html>
